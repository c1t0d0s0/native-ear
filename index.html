<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NativeEar - TOEIC 英語リスニング・ディクテーション特訓</title>
    <meta name="description" content="TOEICリスニングスコアアップのためのディクテーション学習アプリ。500〜900点レベル別ネイティブ音声・リアルタイムDiff判定。" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('native_ear_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
