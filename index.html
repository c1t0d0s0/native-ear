<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NativeEar - TOEIC 英語リスニング・ディクテーション特訓</title>
    <meta name="description" content="TOEICリスニングスコアアップのためのディクテーション学習アプリ。500〜900点レベル別ネイティブ音声・リアルタイムDiff判定。" />
    <!-- Config & Google Analytics / GTM -->
    <script src="./config.js"></script>
    <script>
      (function() {
        try {
          const id = window.GTM_ID || (typeof GTM_ID !== 'undefined' ? GTM_ID : '');
          if (id && id.trim()) {
            const trimmedId = id.trim();
            if (trimmedId.startsWith('GTM-')) {
              // Google Tag Manager
              if (!document.querySelector('script[src*="googletagmanager.com/gtm.js"]')) {
                (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
                new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
                j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
                'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
                })(window,document,'script','dataLayer',trimmedId);
              }
            } else {
              // Google Analytics 4 (gtag.js) e.g. G-XXXXXXXXXX
              if (!document.querySelector('script[src*="googletagmanager.com/gtag/js"]')) {
                const gaScript = document.createElement('script');
                gaScript.async = true;
                gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(trimmedId);
                document.head.appendChild(gaScript);

                window.dataLayer = window.dataLayer || [];
                function gtag(){ window.dataLayer.push(arguments); }
                window.gtag = gtag;
                gtag('js', new Date());
                gtag('config', trimmedId);
              }
            }
          }
        } catch (e) {
          console.warn('Analytics initialization error:', e);
        }
      })();
    </script>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('native_ear_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
