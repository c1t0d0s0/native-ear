[package]
name = "native-ear"
version = "2.0.0"
description = "NativeEar - TOEIC 英語リスニング・ディクテーション特訓"
authors = ["NativeEar Team"]
license = "MIT"
repository = "https://github.com/c1t0d0s0/native-ear"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "native_ear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

